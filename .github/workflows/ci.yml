name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit (v6.1.0): a tag can be moved, a SHA cannot.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compile policy, build C++20 sidecar, and run 28 hostile tests
        run: |
          make policy
          make build
          make test

      - name: Install bubblewrap for confined-fence tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run live Linux kernel SECCOMP_RET_USER_NOTIF red-team tests
        env:
          MCP_GATE_ALLOW_SYSCTL_TEST: "1"
        run: |
          # sudo resets the environment, so CI is forwarded explicitly: the
          # suite's "skip locally, fail on CI" guards (Landlock, seccomp host)
          # only fail on CI if they can see CI=true.
          sudo env CI="$CI" MCP_GATE_ALLOW_SYSCTL_TEST=1 make test-seccomp

      - name: Install Lean 4 and verify universal Non-Interference proof
        run: |
          # elan installer pinned to tag v4.4.0 and checked against its
          # SHA-256 before it runs (was: unpinned master piped into sh).
          curl -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/v4.4.0/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y
          export PATH="$HOME/.elan/bin:$PATH"
          # Toolchain is still elan's default (stable); this line records which
          # Lean version checked the proof so it can be pinned in a follow-up.
          lean --version
          make verify | tee lean_out.txt
          if grep -q "sorryAx" lean_out.txt; then
            echo "ERROR: sorryAx detected in Lean proof"
            exit 1
          fi
